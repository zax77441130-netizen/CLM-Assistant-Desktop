[project]
name = "clm-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.13.2",
  "fastapi==0.112.2",
  "pydantic==2.8.2",
  "psutil==7.0.0",
  "pywinauto==0.6.9",
  "sqlalchemy==2.0.32",
  "uvicorn==0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.0",
  "mypy==1.11.1",
  "pyinstaller==6.10.0",
  "pytest==8.3.2",
  "ruff==0.6.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
